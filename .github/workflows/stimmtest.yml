# Hörprobe mit offenen Stimm-Modellen (VoxCPM2, OmniVoice), kostenlos auf den GitHub-Servern (CPU).
# Jedes Modell läuft auf einem eigenen Server (7 GB Speicher reichen nicht für beide), Ergebnis im
# Branch "stimmtest-<modell>": stimmen/*.mp3, <modell>/dialog.mp3, bericht.json
name: Stimmtest

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'Welche Modelle (JSON-Liste)'
        type: string
        default: '["omnivoice", "voxcpm2"]'

permissions:
  contents: write

jobs:
  stimmen:
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Platz schaffen und Auslagerungsspeicher
        run: |
          df -h / | tail -1
          # vorinstallierte Werkzeuge, die hier niemand braucht (Android, .NET, Haskell, CodeQL)
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h / | tail -1
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -g; nproc; df -h / | tail -1
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Pakete (PyTorch nur für die CPU)
        run: |
          pip install --quiet --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet soundfile numpy
          case "${{ matrix.engine }}" in
            voxcpm2) pip install --quiet "voxcpm>=2.0.3" ;;
            omnivoice) pip install --quiet omnivoice ;;
          esac
      - name: Stimmen entwerfen (VoxCPM2)
        if: matrix.engine == 'voxcpm2'
        continue-on-error: true
        timeout-minutes: 90
        run: python scripts/stimmtest.py design --out stimmtest
      - name: Dialog
        continue-on-error: true
        timeout-minutes: 180
        run: python scripts/stimmtest.py ${{ matrix.engine }} --out stimmtest
      - name: Ergebnis in Branch schreiben
        if: always()
        run: |
          cd stimmtest || exit 0
          for f in stimmen/*.wav; do [ -f "$f" ] && ffmpeg -y -loglevel error -i "$f" -b:a 96k "${f%.wav}.mp3" && rm "$f"; done
          cat bericht.json || true
          git init -q -b "stimmtest-${{ matrix.engine }}"
          git add -A
          git -c user.name="Lagebild" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Stimmtest ${{ matrix.engine }} $(date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "stimmtest-${{ matrix.engine }}"
