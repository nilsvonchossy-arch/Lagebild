# Messlauf und Demo: die Demo-Folge mit der Stimme der Pipeline vertonen (wie im Tageslauf, ohne Claude).
# Ergebnis im Branch "demo-audio": JJJJ-MM-TT.json mit Zeitmarken, audio/…/folge.mp3, Protokoll der Stimme.
name: Demo vertonen

on:
  workflow_dispatch:
    inputs:
      stimme:
        description: 'voxcpm2 oder azure'
        type: choice
        options: [voxcpm2, azure]
        default: voxcpm2
      modus:
        description: 'VoxCPM2: wie in config/pipeline.json, fortsetzung (Klang der Stimmprobe) oder steuerbar (Ausdruck je Zeile); ein Modus schreibt in demo-audio-<modus>'
        type: choice
        options: ['', fortsetzung, steuerbar]
        default: ''
      datei:
        description: 'Folge, die vertont wird (JSON im Repo)'
        type: string
        default: public/demo/2026-10-27.json
      ziel:
        description: 'Branch für das Ergebnis; leer = demo-audio bzw. demo-audio-<modus>'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  vertonen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - if: inputs.stimme == 'voxcpm2'
        uses: ./.github/actions/stimme
      - name: Vertonen
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: node pipeline/run.ts --vertonen ${{ inputs.datei }} --out vertont --stimme ${{ inputs.stimme }} ${{ inputs.modus && format('--modus {0}', inputs.modus) || '' }}
      - name: Ergebnis in Branch schreiben
        if: always()
        run: |
          mkdir -p vertont/logs
          cp /tmp/lagebild-stimme/*/ergebnis.json vertont/logs/ 2>/dev/null || true
          cd vertont
          rm -f audio/*/mix.wav audio/*/stimme.wav
          BRANCH="${{ inputs.ziel }}"
          [ -n "$BRANCH" ] || BRANCH=demo-audio${{ inputs.modus && format('-{0}', inputs.modus) || '' }}
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="Lagebild" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Demo vertont $(date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
