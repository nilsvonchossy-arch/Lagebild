<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark">
<title>Lagebild</title>
</head>
<body>
<div id="app">
  <canvas id="globe" aria-hidden="true"></canvas>
  <div class="fx scan"></div>
  <div class="fx vignette"></div>
  <div id="pin" aria-hidden="true"><span class="flag" id="pinFlag"></span><span id="pinName"></span></div>

  <header class="hud">
    <div class="progress" id="progress"></div>
    <div class="meta">
      <div class="stamp-date"><span class="pix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="metaDate"></span><span class="brand">LAGEBILD</span></div>
      <div class="tools">
        <button class="iconbtn" id="voiceBtn" type="button" aria-pressed="true" aria-label="Stimme an oder aus"></button>
        <button class="iconbtn" id="setBtn" type="button" aria-label="Einstellungen"></button>
      </div>
    </div>
  </header>

  <div class="hud" id="caption" aria-live="polite">
    <div class="role" id="capRole"></div>
    <p class="ctext" id="capText"></p>
  </div>

  <div class="hud" id="stage">
    <div id="title"><div class="t-date" id="tDate"></div><div class="t-sub" id="tSub"></div></div>
  </div>

  <div class="hud">
    <article class="card" id="card" data-state="hidden" aria-live="polite">
      <div class="card-top rv" style="--d:.25s"><span class="tag" id="cTag"></span><span class="count" id="cCount"></span></div>
      <h2 class="headline" id="cHead"></h2>
      <p class="brief rv" style="--d:.7s"><b>Kurz gesagt:</b> <span id="cBrief"></span></p>
      <div class="figure rv" id="cFigure" style="--d:.85s"><span class="fig-num" id="cFig"></span><span class="fig-label" id="cFigLabel"></span></div>
      <div class="card-foot rv" style="--d:1s"><a class="src" id="cSrc" target="_blank" rel="noopener">Quelle <span class="sep"></span> <b id="cSrcName"></b> <span class="src-date" id="cSrcDate"></span> ↗</a><span class="foot-mark" id="cMark"></span></div>
    </article>
  </div>

  <nav class="hud controls" aria-label="Wiedergabe">
    <button class="ctl" id="prevBtn" type="button" aria-label="Vorherige Meldung"></button>
    <button class="ctl main" id="playPause" type="button" aria-label="Abspielen"></button>
    <button class="ctl" id="nextBtn" type="button" aria-label="Nächste Meldung"></button>
  </nav>

  <section class="overlay" id="start">
    <div class="panel">
      <div class="kicker" id="sKicker">LAGEBILD · TAGESUPDATE</div>
      <h1 class="p-title" id="sTitle">Lade Lagebild …</h1>
      <p class="p-sub" id="sSub"></p>
      <ol class="p-list" id="sList"></ol>
      <div class="p-actions">
        <button class="btn primary" id="playBtn" type="button" disabled></button>
        <button class="btn" id="archiveBtn" type="button">Archiv</button>
      </div>
      <p class="fine" id="sFine"></p>
    </div>
  </section>

  <section class="overlay" id="end" hidden>
    <div class="panel">
      <div class="kicker">UPDATE BEENDET</div>
      <h1 class="p-title">Das war dein Lagebild</h1>
      <ol class="p-list" id="eList"></ol>
      <div class="p-actions">
        <button class="btn primary" id="againBtn" type="button"></button>
        <button class="btn" id="menuBtn" type="button">Übersicht</button>
      </div>
    </div>
  </section>

  <section id="sheet" class="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle">Einstellungen</h2><button class="iconbtn" id="sheetClose" type="button" aria-label="Schließen"></button></div>
      <div class="grp">
        <div class="row"><span>Atmo-Sound (Bass-Teppich)</span><button class="switch" id="atmoSw" type="button" role="switch" aria-checked="true" aria-label="Atmo-Sound"></button></div>
      </div>
      <div class="grp">
        <label for="rate">Sprechtempo <span id="rateVal"></span></label>
        <input type="range" id="rate" min="0.8" max="1.3" step="0.05">
      </div>
      <div class="grp">
        <label for="voiceSel">Systemstimme (nur ohne Audiodateien)</label>
        <select id="voiceSel"></select>
        <p class="note" id="voiceNote"></p>
      </div>
    </div>
  </section>

  <section id="archive" class="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
      <div class="sheet-head"><h2 id="archiveTitle">Archiv</h2><button class="iconbtn" id="archiveClose" type="button" aria-label="Schließen"></button></div>
      <ol class="p-list" id="aList"></ol>
    </div>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
