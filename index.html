<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="description" content="Dein tägliches News-Update mit Globus, Stimme und Untertiteln.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lagebild">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Lagebild</title>
</head>
<body>
<div id="app">
  <canvas id="earth" aria-hidden="true"></canvas>
  <canvas id="globe" aria-hidden="true"></canvas>
  <div class="fx vignette"></div>
  <div id="pin" aria-hidden="true">
    <span class="pin-row"><span class="flag" id="pinFlag"></span><span id="pinName"></span></span>
    <span class="pin-fig" id="pinFig"><b id="pinFigNum"></b><small id="pinFigLabel"></small></span>
  </div>

  <header class="hud">
    <div class="progress" id="progress"></div>
    <div class="meta">
      <div class="stamp-date"><span id="metaDate"></span><span class="brand" id="metaEp">LAGEBILD</span></div>
      <div class="tools">
        <button class="iconbtn" id="voiceBtn" type="button" aria-pressed="true" aria-label="Stimme an oder aus"></button>
        <button class="iconbtn" id="setBtn" type="button" aria-label="Einstellungen"></button>
      </div>
    </div>
  </header>

  <div class="hud" id="caption" aria-live="polite">
    <div class="role" id="capRole"></div>
    <p class="ctext" id="capText"></p>
  </div>

  <div class="hud" id="viz" data-state="hidden" aria-hidden="true"></div>

  <div class="hud" id="stage">
    <div id="title"><div class="t-date" id="tDate"></div><div class="t-sub" id="tSub"></div></div>
  </div>

  <div class="hud cardwrap">
    <article class="card" id="card" data-state="hidden" aria-live="polite" role="button" tabindex="0" aria-label="Details zur Meldung">
      <div class="c-top"><span class="c-flag" id="cFlag"></span><span class="c-place" id="cPlace"></span><span class="c-count" id="cCount"></span></div>
      <h2 class="c-line" id="cLine"></h2>
      <div class="mkt" id="cMarkets" hidden></div>
      <span class="c-more" aria-hidden="true">Details</span>
    </article>
  </div>

  <nav class="hud controls" aria-label="Wiedergabe">
    <button class="ctl" id="prevBtn" type="button" aria-label="Vorherige Meldung"></button>
    <button class="ctl main" id="playPause" type="button" aria-label="Abspielen"></button>
    <button class="ctl" id="nextBtn" type="button" aria-label="Nächste Meldung"></button>
  </nav>

  <section class="overlay" id="start">
    <div class="panel">
      <div class="kicker" id="sKicker">Lagebild</div>
      <h1 class="p-title" id="sTitle">Lade Lagebild …</h1>
      <p class="p-sub" id="sSub"></p>
      <ol class="p-list" id="sList"></ol>
      <div class="p-actions">
        <button class="btn primary" id="playBtn" type="button" disabled></button>
        <button class="btn" id="topicsBtn" type="button">Themen</button>
        <button class="btn" id="archiveBtn" type="button">Archiv</button>
      </div>
      <p class="fine" id="sFine"></p>
    </div>
  </section>

  <section class="overlay" id="end" hidden>
    <div class="panel">
      <div class="kicker" id="eKicker">Folge beendet</div>
      <h1 class="p-title">Alle Meldungen mit Quellen</h1>
      <div class="det-list" id="eList"></div>
      <div class="p-actions">
        <button class="btn primary" id="againBtn" type="button"></button>
        <button class="btn" id="menuBtn" type="button">Übersicht</button>
      </div>
    </div>
  </section>

  <section id="details" class="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <div class="sheet-head"><h2 id="detailsTitle">Meldung</h2><button class="iconbtn" id="detailsClose" type="button" aria-label="Schließen"></button></div>
      <div id="detailsBody"></div>
    </div>
  </section>

  <section id="sheet" class="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle">Einstellungen</h2><button class="iconbtn" id="sheetClose" type="button" aria-label="Schließen"></button></div>
      <div class="grp" id="topicsBox"></div>
      <div class="grp">
        <span class="lbl">Wiedergabe</span>
        <div class="list">
          <div class="row"><span>Musik im Hintergrund</span><button class="switch" id="atmoSw" type="button" role="switch" aria-checked="true" aria-label="Musik im Hintergrund"></button></div>
          <label class="row" for="rate"><span>Sprechtempo <span id="rateVal"></span></span><input type="range" id="rate" min="0.8" max="1.3" step="0.05"></label>
          <label class="row" for="voiceSel"><span>Systemstimme</span><select id="voiceSel"></select></label>
        </div>
        <p class="note" id="voiceNote"></p>
      </div>
      <div class="grp" id="ghBox"></div>
      <p class="note">Globus: NASA Earth Observatory (Blue Marble, Black Marble), gemeinfrei. Grenzen: Natural Earth.</p>
    </div>
  </section>

  <section id="archive" class="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
      <div class="sheet-head"><h2 id="archiveTitle">Archiv</h2><button class="iconbtn" id="archiveClose" type="button" aria-label="Schließen"></button></div>
      <ol class="p-list" id="aList"></ol>
    </div>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
